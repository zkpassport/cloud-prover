apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zkpassport-cloud-prover

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  # TLS + routing via the Gateway API (Certificate Manager certmap serves both
  # zkpassport.id and testnet.aztec.network). The old Ingress + ManagedCertificate
  # files are kept in the tree for rollback but are no longer applied.
  - gateway.yaml
  - httproute.yaml
  - gcpbackendpolicy.yaml
  - hpa.yaml

# CI runs `kustomize edit set image` to pin the freshly built tag.
images:
  - name: us-central1-docker.pkg.dev/zkpassport-cloud-prover/cloud-prover/cloud-prover
    newTag: latest
