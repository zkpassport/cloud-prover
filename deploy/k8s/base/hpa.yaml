apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloud-prover
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloud-prover
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  # NOTE: CPU-based scaling is a coarse proxy for "a proof is running" (mirrors
  # the previous setup). Each new pod triggers the cluster autoscaler to add a
  # spot node. True one-proof-per-pod admission control would need a queue/
  # concurrency gate in the app or a custom (request-count) metric.
