apiVersion: v1
kind: Service
metadata:
  name: cloud-prover
  labels:
    app: cloud-prover
  annotations:
    # Container-native load balancing (NEG); used by the Gateway backend.
    cloud.google.com/neg: '{"ingress": true}'
    # NOTE: the proof timeout (~84s) is set via the GCPBackendPolicy
    # (gcpbackendpolicy.yaml). The Ingress-style cloud.google.com/backend-config
    # annotation is intentionally omitted — the Gateway controller rejects the
    # Service if it is present.
spec:
  type: ClusterIP
  selector:
    app: cloud-prover
  ports:
    - name: http
      port: 3000
      targetPort: http
