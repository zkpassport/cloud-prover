# Builds the cloud prover image on Cloud Build. bb is fetched as a prebuilt
# binary (not compiled), so this is a light, fast build; the GitHub Actions
# workflow just submits + deploys.
substitutions:
  _REPO: us-central1-docker.pkg.dev/zkpassport-cloud-prover/cloud-prover/cloud-prover
  _SHA: manual

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REPO}:${_SHA}
      - -t
      - ${_REPO}:latest
      - .

images:
  - ${_REPO}:${_SHA}
  - ${_REPO}:latest

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  # Send logs to Cloud Logging (not the default GCS bucket) so the CI service
  # account — which isn't project Viewer/Owner — can submit without the
  # "can only stream logs if you are Viewer/Owner" error.
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
