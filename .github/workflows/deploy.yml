name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zkpassport-cloud-prover
  REGION: us-central1
  SERVICE: gcloud-prover
  REPO: us-central1-docker.pkg.dev/zkpassport-cloud-prover/cloud-prover/cloud-prover

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/543818303676/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@zkpassport-cloud-prover.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Build + push image on a high-CPU Cloud Build machine (bb compiles from source).
      - name: Build image
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=cloudbuild.yaml \
            --substitutions=_REPO="$REPO",_SHA="${GITHUB_SHA::7}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$REPO:${GITHUB_SHA::7}" \
            --port=8080 \
            --cpu=8 \
            --memory=8Gi \
            --concurrency=1 \
            --min-instances=1 \
            --max-instances=15 \
            --timeout=3600 \
            --execution-environment=gen2 \
            --cpu-boost \
            --allow-unauthenticated
